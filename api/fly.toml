app = "legalai-api"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

[mounts]
  source = "legalai_data"
  destination = "/app/uploads"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
