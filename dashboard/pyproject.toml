[project]
name = "legalai-dashboard"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "nicegui>=2.0.0",
    "httpx>=0.27.0",
    "pydantic-settings>=2.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dashboard"]

[tool.uv]
package = true
